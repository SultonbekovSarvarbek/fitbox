# Mahalliy ishlab chiqish: `docker compose up --build`
# API: http://localhost:8000  ·  hujjat: http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fitbody
      POSTGRES_PASSWORD: fitbody
      POSTGRES_DB: fitbody
    # Mahalliy vositalar uchun (migratsiya yaratish, DB ko'rish).
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitbody"]
      interval: 3s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fitbody:fitbody@db:5432/fitbody
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
